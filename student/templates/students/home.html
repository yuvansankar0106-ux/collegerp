<!DOCTYPE html>
<html>
<head>
    <title>Student Home</title>
    <style>
        body { font-family: Arial; margin: 0; background: #f4f6f8; }
        .header { background: #0d47a1; color: white; padding: 20px; text-align: center; }
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 40px; flex-wrap: wrap; }
        .card { background: white; padding: 25px; border-radius: 12px; width: 220px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card h3 { color: #0d47a1; }
        .card a { text-decoration: none; background: #0d47a1; color: white; padding: 8px 16px; border-radius: 6px; display: inline-block; margin-top: 10px; }
        .logout { position: absolute; top: 20px; right: 20px; background: red; color: white; padding: 8px 14px; border-radius: 6px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Student Home</h1>
        <p>Welcome to College ERP</p>
        <a href="/logout/" class="logout">Logout</a>
    </div>

    <div class="container">
        <div class="card">
            <h3>👤 Profile</h3>
            <p>View your profile</p>
            <a href="/profile/">Open</a>
        </div>
        <div class="card">
            <h3>📚 Courses</h3>
            <p>View your courses</p>
            <a href="/courses/">Open</a>
        </div>
        <div class="card">
            <h3>📊 Attendance</h3>
            <p>Check attendance</p>
            <a href="/attendance/">Open</a>
        </div>
    </div>
</body>
</html>
