<h1>Student Profile - Type Pannalam</h1>
<form method="POST">
    {% csrf_token %}
    <p>Name: <input type="text" name="name" value="{{ student.name }}"></p>
    <p>Age: <input type="number" name="age" value="{{ student.age }}"></p>
    <p>Roll No: <input type="text" name="roll_no" value="{{ student.roll_no }}"></p>
    <p>Email: <input type="email" name="email" value="{{ student.email }}"></p>
    <p>Dept: <input type="text" name="dept" value="{{ student.dept }}"></p>
    <button type="submit">Save</button>
</form>
<hr>
<h2>Saved:</h2>
<p>Name: {{ student.name }} | Age: {{ student.age }} | Roll: {{ student.roll_no }}</p>
<a href="/">Home</a>
